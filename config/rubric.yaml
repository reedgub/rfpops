version: "1.0"
model: "claude-sonnet-4-5"
max_tokens: 4096

dimensions:
  capability_match:
    weight: 0.30
    label: "Capability Match"
    description: "How well the agency's technical services, certifications, and tech stack align with RFP requirements"
    score_guide:
      1: "Major capability gaps — missing core technologies or certifications required by RFP"
      2: "Several significant gaps — can address some requirements but lacks key elements"
      3: "Adequate match — covers main requirements with minor gaps"
      4: "Strong match — covers all core requirements, minor stretch items only"
      5: "Excellent match — perfect alignment, agency has exact required certifications and tech stack"

  past_performance:
    weight: 0.25
    label: "Past Performance"
    description: "Relevance and comparability of the agency's past contracts to this opportunity"
    score_guide:
      1: "No comparable past performance — different agency type, scale, and domain"
      2: "Tangentially related — similar technology but different agency or much smaller scale"
      3: "Relevant past performance — similar work but different agency or slightly different scale"
      4: "Strong past performance — comparable agency, scope, and dollar value"
      5: "Directly comparable — same agency type, similar dollar value, same technical domain"

  win_probability:
    weight: 0.20
    label: "Win Probability"
    description: "Likelihood of winning based on competition signals, incumbent presence, set-aside status"
    score_guide:
      1: "Wired for incumbent — strong incumbent signals, no industry day, single source indicators"
      2: "Low probability — strong incumbent or multiple large competitors with agency relationships"
      3: "Competitive — open competition, no clear incumbent, agency is one of several viable competitors"
      4: "Good position — set-aside status favors agency, or limited competition, or prior relationship"
      5: "Strong position — sole source or very limited competition aligned with agency's exact profile"

  margin_viability:
    weight: 0.15
    label: "Margin Viability"
    description: "Whether contract value, period, and scope allow acceptable margins given agency size"
    score_guide:
      1: "Unviable — contract below $250K or scope requires unsustainable staffing for the value"
      2: "Tight — possible but requires perfect execution with no contingency"
      3: "Acceptable — standard margins achievable with competent execution"
      4: "Good — strong value/scope ratio, room for contingency"
      5: "Excellent — high value relative to scope, favorable terms, strong margin potential"

  strategic_fit:
    weight: 0.10
    label: "Strategic Fit"
    description: "Whether this contract advances agency's strategic goals — new logos, capabilities, domains"
    score_guide:
      1: "No strategic value — commodity work in a domain the agency is exiting"
      2: "Minimal strategic value — routine work, no new capabilities or relationships"
      3: "Neutral — neither strategically valuable nor a distraction"
      4: "Good strategic fit — new federal logo, builds a new capability, or strong reference value"
      5: "Excellent strategic fit — transforms the agency's portfolio or unlocks a new market"

  disqualifiers:
    weight: null
    label: "Disqualifiers"
    is_gate: true
    description: "Hard stops — any disqualifier triggers automatic NO-BID regardless of other scores"

thresholds:
  bid_minimum_score: 3.5
  maybe_minimum_score: 2.5
  bid_minimum_confidence: "MEDIUM"

banned_phrases:
  - "leverage"
  - "synergy"
  - "best-in-class"
  - "world-class"
  - "cutting-edge"
  - "robust"
  - "seamlessly"
  - "empower"
  - "unlock value"
  - "drive outcomes"
  - "holistic"
  - "innovative solution"
  - "value-added"

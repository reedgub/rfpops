[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rfpops"
version = "0.1.0"
description = "CLI tool for federal RFP evaluation and proposal support"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pdfplumber>=0.11",
    "playwright>=1.48",
    "pyyaml>=6",
    "rich>=13",
    "click>=8",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4",
]

[project.scripts]
rfpops = "core.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["core"]
omit = ["tests/*"]
